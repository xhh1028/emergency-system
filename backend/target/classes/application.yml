server:
  # 8080 被本机 NIApplicationWebServer 服务占用，因此项目固定使用 8081。
  port: 8081

spring:
  application:
    name: emergency-system-backend

  # .env.local 优先于旧的 .env；请从 backend 目录启动。
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:.env.local[.properties]

  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&sslMode=${DB_SSL_MODE:REQUIRED}&allowPublicKeyRetrieval=${DB_ALLOW_PUBLIC_KEY_RETRIEVAL:false}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000

  # JSON 日期默认使用中国时区，方便后续业务接口直接复用。
  jackson:
    time-zone: Asia/Shanghai

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB

app:
  upload-dir: uploads
  ai:
    # OpenAI 兼容的 chat/completions 完整地址；未配置时自动使用本地规则研判。
    endpoint: ${AI_ENDPOINT:}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:}
